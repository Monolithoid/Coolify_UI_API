version: "3.8"

services:
  coolify-stack:
    image: monolithoid/coolify-api:latest
    pull_policy: always
    container_name: coolify-web-and-api
    ports:
      - "80:80"
    environment:
      PORT: 80
      COOLIFY_BASE_URL: https://coolify.example.com/api
      COOLIFY_TOKEN: token-example
      COOLIFY_SERVICE_ID: service-id-par-defaut
      DISCORD_TOKEN: bot-token
      GAME_PRESETS: |
        [
          {
            "id": "default-game",
            "name": "Serveur par defaut",
            "serviceId": "service-id-par-defaut",
            "imageUrl": "https://example.com/default-image.png",
            "discordVoiceChannelIds": ["123456789012345678"],
            "instructions": "Rejoignez le serveur et suivez ces consignes"
          }
        ]
      # Si vous préférez configurer les salons en dehors de GAME_PRESETS, utilisez les variables suivantes :
      # DISCORD_DEFAULT_GAME_ID: default-game
      # DISCORD_VOICE_CHANNEL_ID: 123456789012345678
      # DISCORD_GAME_CHANNEL_MAPPINGS: '[{"channelId":"123","gameId":"default-game","instructions":"Rejoignez le serveur Minecraft en version 1.20"}]'
      # DISCORD_GAME_INSTRUCTION_MAPPINGS: '{"default-game":"Consignes spécifiques par jeu"}'
    restart: unless-stopped
