<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des serveurs de jeux</title>
    <link rel="icon" type="image/png" href="/Icon.png">
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <header class="hero">
        <div class="hero-brand">
            <div class="brand-icon-wrapper" aria-hidden="true">
                <img src="/Icon.png" alt="Logo Coolify" class="brand-icon">
            </div>
            <div>
                <p class="eyebrow">Orchestration Coolify</p>
                <h1>Gestion multi-serveurs</h1>
                <p class="lead">Contrôlez plusieurs services Coolify et administrez vos jeux.</p>
            </div>
        </div>
        <section class="auth hero-auth">
            <h2>Connexion</h2>
            <p>Connectez-vous avec Google pour contrôler les serveurs.</p>
            <p id="auth-status" class="status-banner">Statut : connexion requise</p>
            <div class="auth-actions">
                <div id="google-login-container" class="google-button-container" aria-live="polite"></div>
                <button id="google-logout" class="secondary hidden" disabled>Déconnexion</button>
            </div>
            <div id="auth-user" class="user-badge hidden" aria-live="polite"></div>
        </section>
    </header>
    <main>
        <section class="admin">
            <div class="admin-header">
                <h2>Administration des jeux</h2>
                <button id="add-game" class="accent">Ajouter un jeu</button>
            </div>
            <p id="server-status" class="status-banner">Statut : prêt</p>
            <div class="admin-grid">
                <div class="admin-list">
                    <h3>Jeux existants</h3>
                    <ul id="games-list"></ul>
                </div>
            </div>
        </section>
    </main>
    <div id="game-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="game-modal-title">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="game-modal-title">Ajouter ou modifier un jeu</h3>
                <button type="button" id="close-modal" aria-label="Fermer">&times;</button>
            </div>
            <form id="game-form">
                <label for="game-id">Identifiant</label>
                <input id="game-id" name="id" type="text" required>

                <label for="game-name">Nom</label>
                <input id="game-name" name="name" type="text" required>

                <label for="service-id">Coolify serviceId</label>
                <input id="service-id" name="serviceId" type="text" required>

                <label for="coolify-url">URL Coolify (optionnel)</label>
                <input id="coolify-url" name="coolifyBaseUrl" type="url" placeholder="https://coolify.example.com/api">

                <label for="coolify-token">Token Coolify (optionnel)</label>
                <input id="coolify-token" name="coolifyToken" type="text">

                <label for="game-image">Image du jeu</label>
                <input id="game-image" name="imageUrl" type="url" placeholder="https://example.com/visuel-jeu.png" required>

                <label for="game-instructions">Instructions Discord (optionnel)</label>
                <textarea id="game-instructions" name="instructions" rows="3" placeholder="Consignes affichées lors du démarrage"></textarea>

                <div class="form-actions">
                    <button type="submit" id="save-game">Enregistrer</button>
                    <button type="button" id="reset-form">Réinitialiser</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
