<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion du serveur de jeu</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <main>
        <section class="auth">
            <h1>Connexion</h1>
            <p>Connectez-vous avec Google pour contrôler le serveur.</p>
            <button id="google-login">Connexion Google</button>
        </section>
        <section class="controls">
            <h2>Contrôle du serveur</h2>
            <p id="server-status">Statut : inconnu</p>
            <div class="actions">
                <button id="start-button">Démarrer le serveur</button>
                <button id="stop-button">Arrêter le serveur</button>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
